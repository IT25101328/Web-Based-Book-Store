<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shopping Cart - Starlight</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=5.0" />
</head>
<body>
  <div class="bg-orbs"><div class="orb orb1"></div><div class="orb orb2"></div></div>

  <header class="navbar glass-nav" id="navbar">
    <nav class="navbar">
      <div class="logo">
        <span class="logo-icon">✨</span>
        <a href="index.html" style="color:white;text-decoration:none;"><h1>Starlight</h1></a>
      </div>
      <ul class="nav-links">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="catalog.html" class="nav-link">Browse Books</a></li>
        <li class="auth-only dropdown" style="display:none;">
          <a href="#" class="nav-link" id="navAccountBtn" onclick="toggleAccountDropdown(event)">Account ▼</a>
          <div class="dropdown-content account-dropdown" id="accountDropdownContent" style="width: 250px; padding: 0.5rem; right: 0; left: auto; background: rgba(20,20,20,0.95); border: 1px solid var(--gold); border-radius: 8px; z-index: 999; display:none; position:absolute;">
            <a href="profile.html" style="display:block; padding:0.5rem; text-decoration:none; color:var(--text); transition:all 0.2s;">👤 Profile</a>
            <a href="orders.html" style="display:block; padding:0.5rem; text-decoration:none; color:var(--text); transition:all 0.2s;">📦 My Orders</a>
            <a href="wishlist.html" style="display:block; padding:0.5rem; text-decoration:none; color:var(--text); transition:all 0.2s;">❤️ Wishlist</a>
            <a href="support.html" style="display:block; padding:0.5rem; text-decoration:none; color:var(--text); transition:all 0.2s;">🎫 Support Tickets</a>
            <a href="change-password.html" style="display:block; padding:0.5rem; text-decoration:none; color:var(--text); transition:all 0.2s;">🔒 Change Password</a>
            <hr style="border-color: rgba(255,255,255,0.1); margin: 0.5rem 0;">
            <a href="#" onclick="logoutMPA(event)" style="display:block; padding:0.5rem; text-decoration:none; color:#ff6b6b; transition:all 0.2s;">🚪 Logout</a>
          </div>
        </li>
      </ul>
      <div class="nav-actions">
        <button id="btnLogin" class="btn-primary guest-only" onclick="window.location.href='login.html'">Log In</button>
        <button class="btn-primary auth-only" onclick="logoutMPA()" style="display:none;">Log Out</button>
      </div>
    </nav>
  </header>

  <main class="main-content" style="max-width: 1200px;">
    <section class="section active-section" style="display:block;">
      <div class="page-header fade-in-up" style="display:flex; justify-content:space-between; align-items:center;">
        <div>
          <h1 class="gradient-text" style="font-size:3rem; margin-bottom:0.5rem;">Your Shopping Cart</h1>
          <p class="text-muted" id="cartItemCount">0 Items</p>
        </div>
        <button class="btn-ghost text-pink auth-only" onclick="clearCart()" style="display:none; border:1px solid var(--glass-b);">Clear Cart</button>
      </div>

      <div class="cart-layout" style="margin-top: 2rem; display:grid; grid-template-columns: 2fr 1fr; gap: 2rem;">
        
        <!-- Cart Items List -->
        <div class="cart-items fade-in-up" id="cartItemsContainer">
          
          <div class="empty-state glass-panel" id="cartEmpty" style="padding: 4rem 2rem;">
            <div class="empty-icon" style="font-size: 4rem; margin-bottom: 1rem;">🛒</div>
            <p style="font-size: 1.2rem; margin-bottom: 2rem;">Your cart is empty</p>
            <button class="btn-primary mt-2" onclick="window.location.href='catalog.html'">Browse Books</button>
          </div>
          
          <div id="cartItemsList" style="display:none; display:flex; flex-direction:column; gap:1.5rem;">
            <!-- Rendered via JS -->
          </div>
        </div>

        <!-- Order Summary -->
        <div class="cart-sidebar fade-in-up" id="cartSidebar" style="display:none;">
          <div class="glass-panel scale-in" style="position: sticky; top: 100px;">
            <h3 style="margin-bottom: 1.5rem; font-size: 1.5rem;">Order Summary</h3>
            
            <div class="summary-row" style="display:flex; justify-content:space-between; margin-bottom:1rem; color:var(--text-muted);">
              <span>Subtotal</span><span id="summarySubtotal">Rs 0.00</span>
            </div>
            
            <div class="summary-row" style="display:flex; justify-content:space-between; margin-bottom:1rem; color:var(--text-muted);">
              <span>Discount</span><span class="text-green">-$0.00</span>
            </div>
            
            <div class="summary-row" style="display:flex; justify-content:space-between; margin-bottom:1rem; color:var(--text-muted);">
              <span>Tax (Estimated)</span><span id="summaryTax">Rs 0.00</span>
            </div>
            
            <div class="summary-row" style="display:flex; justify-content:space-between; margin-bottom:1rem; color:var(--text-muted);">
              <span>Shipping</span><span class="text-green" id="summaryShipping">Free</span>
            </div>
            
            <div class="summary-divider" style="height:1px; background:var(--glass-b); margin:1.5rem 0;"></div>
            
            <div class="summary-row summary-total" style="display:flex; justify-content:space-between; font-size:1.5rem; font-weight:700; margin-bottom:2rem; color:var(--primary);">
              <span>Final Total</span><span id="summaryTotal">Rs 0.00</span>
            </div>
            
            <button class="btn-primary w-100 mt-2" style="font-size:1.1rem; padding:1rem;" onclick="window.location.href='checkout.html'">Proceed to Checkout 🚀</button>
          </div>
        </div>
      </div>
    </section>
  </main>
  
  <div id="toast" class="toast"></div>
  <script src="app.js?v=6.0"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      applyAuthState();
      loadCartPage();
    });
  </script>
<script src='theme.js'></script>
</body>
</html>
