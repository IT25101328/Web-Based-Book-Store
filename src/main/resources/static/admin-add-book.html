<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add New Book | Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=6.0">
  <style>
    body { background: #0b0e1a; color: #e2e8f0; font-family: 'Inter', sans-serif; display: flex; min-height: 100vh; }
    .main-wrapper { flex: 1; padding: 2rem; max-width: 900px; margin: 0 auto; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
    .page-title { font-family: 'Outfit', sans-serif; font-size: 2rem; font-weight: 900; }
    .page-title span { background: linear-gradient(135deg,#d4a373,#a66a32); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .glass-panel { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 2rem; margin-bottom: 1.5rem; }
    .panel-header { border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 1rem; margin-bottom: 1.5rem; font-weight: 700; font-size: 1.2rem; }
    
    .form-row { display: flex; gap: 1.5rem; margin-bottom: 1.5rem; }
    .form-group { flex: 1; display: flex; flex-direction: column; gap: 0.5rem; }
    .form-group label { font-size: 0.85rem; color: #94a3b8; font-weight: 600; }
    .form-control { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #e2e8f0; padding: 0.75rem 1rem; border-radius: 8px; font-family: 'Inter', sans-serif; transition: border-color 0.2s; }
    .form-control:focus { outline: none; border-color: #d4a373; background: rgba(255,255,255,0.08); }
    .form-control:disabled { background: rgba(255,255,255,0.02); color: #64748b; cursor: not-allowed; }
    textarea.form-control { resize: vertical; min-height: 100px; }
    
    .upload-box { border: 2px dashed rgba(255,255,255,0.2); border-radius: 12px; padding: 2rem; text-align: center; cursor: pointer; transition: all 0.2s; background: rgba(255,255,255,0.02); }
    .upload-box:hover { border-color: #d4a373; background: rgba(212,163,115,0.05); }
    .upload-icon { font-size: 2.5rem; margin-bottom: 1rem; color: #d4a373; }
    .upload-text { font-size: 1rem; font-weight: 600; margin-bottom: 0.5rem; }
    .upload-subtext { font-size: 0.85rem; color: #64748b; }
    
    .btn-submit { background: linear-gradient(135deg,#d4a373,#a66a32); color: #000; border: none; padding: 1rem 2rem; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer; width: 100%; transition: transform 0.2s; }
    .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(212,163,115,0.3); }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }
    
    .back-link { color: #94a3b8; text-decoration: none; font-size: 0.9rem; font-weight: 600; transition: color 0.2s; display: inline-block; margin-bottom: 1rem; }
    .back-link:hover { color: #d4a373; }
    
    #toast { position: fixed; bottom: 2rem; right: 2rem; padding: 1rem 1.5rem; border-radius: 10px; font-weight: 600; z-index: 9999; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
    #toast.show { opacity: 1; }
    #toast.success { background: #22c55e; color: #fff; }
    #toast.error { background: #ef4444; color: #fff; }
    
    .loading-spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #fff; animation: spin 1s ease-in-out infinite; margin-right: 8px; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="main-wrapper">
    <a href="admin-dashboard.html" class="back-link">&larr; Back to Dashboard</a>
    
    <div class="top-bar">
      <div class="page-title">Add New <span>Book</span></div>
    </div>

    <!-- Step 1: Upload PDF -->
    <div class="glass-panel">
      <div class="panel-header">1. Upload Book PDF</div>
      <input type="file" id="pdfFileInput" accept="application/pdf" style="display: none;" onchange="handleFileUpload(event)">
      <div class="upload-box" id="uploadBox" onclick="document.getElementById('pdfFileInput').click()">
        <div class="upload-icon">&#128196;</div>
        <div class="upload-text" id="uploadStatusText">Click to select PDF file</div>
        <div class="upload-subtext" id="uploadSubText">PDF format only. We'll automatically extract the page count.</div>
      </div>
    </div>

    <!-- Step 2: Book Details -->
    <div class="glass-panel">
      <div class="panel-header">2. Book Details</div>
      <form id="addBookForm" onsubmit="submitBook(event)">
        
        <div class="form-row">
          <div class="form-group">
            <label>Book Name (Title)</label>
            <input type="text" class="form-control" id="bTitle" required placeholder="e.g. The Great Gatsby">
          </div>
          <div class="form-group">
            <label>Author Name</label>
            <input type="text" class="form-control" id="bAuthor" required placeholder="e.g. F. Scott Fitzgerald">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Book Type (Genre)</label>
            <select class="form-control" id="bGenre" required>
              <option value="" disabled selected>Select a Genre</option>
              <option value="Fiction">Fiction</option>
              <option value="Non-Fiction">Non-Fiction</option>
              <option value="Science Fiction">Science Fiction</option>
              <option value="Fantasy">Fantasy</option>
              <option value="Mystery">Mystery</option>
              <option value="Thriller">Thriller</option>
              <option value="Romance">Romance</option>
              <option value="Historical Fiction">Historical Fiction</option>
              <option value="Horror">Horror</option>
              <option value="Biography">Biography</option>
              <option value="History">History</option>
              <option value="Technology">Technology</option>
              <option value="Business">Business</option>
              <option value="Science">Science</option>
            </select>
          </div>
          <div class="form-group">
            <label>Release Date</label>
            <input type="date" class="form-control" id="bReleaseDate" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Auto-detected Page Count</label>
            <input type="number" class="form-control" id="bPageCount" placeholder="Will be filled after PDF upload" disabled>
          </div>
          <div class="form-group">
            <label>Cover Image (JPG/PNG)</label>
            <input type="file" class="form-control" id="bCoverImage" accept="image/png, image/jpeg" required>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Price (Rs)</label>
            <input type="number" step="0.01" class="form-control" id="bPrice" required placeholder="e.g. 19.99">
          </div>
          <div class="form-group">
            <label>Book Format</label>
            <select class="form-control" id="bFormat" required>
              <option value="" disabled selected>Select Format</option>
              <option value="EBOOK">E-Book Only</option>
              <option value="PHYSICAL">Physical Book Only</option>
              <option value="BOTH">Both (E-Book & Physical)</option>
            </select>
          </div>
          <div class="form-group">
            <label>Physical Quantity (Stock)</label>
            <input type="number" class="form-control" id="bStock" value="10" required>
          </div>
        </div>

        <div class="form-group" style="margin-bottom: 2rem;">
          <label>Small Intro (Description)</label>
          <textarea class="form-control" id="bDescription" required placeholder="Enter a brief summary about the book..."></textarea>
        </div>

        <!-- Hidden fields for PDF data -->
        <input type="hidden" id="pdfFileNameHidden">
        
        <button type="submit" class="btn-submit" id="submitBtn">Create Book</button>
      </form>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    const token = localStorage.getItem('sb_token');
    const currentUser = JSON.parse(localStorage.getItem('sb_user') || 'null');

    if (!token || !currentUser || currentUser.role !== 'ADMIN') {
      window.location.href = 'login.html';
    }

    function toast(msg, type='success') {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = `show ${type}`;
      setTimeout(() => { el.className = ''; }, 3000);
    }

    async function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      if (file.type !== "application/pdf") {
        toast("Please upload a valid PDF file.", "error");
        return;
      }

      const box = document.getElementById('uploadBox');
      const text = document.getElementById('uploadStatusText');
      const sub = document.getElementById('uploadSubText');
      
      text.innerHTML = '<span class="loading-spinner"></span> Uploading and analyzing PDF...';
      sub.textContent = 'Please wait...';
      box.style.pointerEvents = 'none';

      const formData = new FormData();
      formData.append("file", file);

      try {
        const res = await fetch('http://localhost:8080/api/books/upload-pdf', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + token },
          body: formData
        });

        const data = await res.json();

        if (res.ok) {
          text.innerHTML = '&#9989; PDF Uploaded Successfully';
          sub.textContent = `Filename: ${file.name}`;
          box.style.borderColor = '#22c55e';
          
          document.getElementById('bPageCount').value = data.pageCount;
          document.getElementById('pdfFileNameHidden').value = data.fileName;
          toast(`Extracted ${data.pageCount} pages from PDF!`, 'success');
        } else {
          throw new Error(data.error || 'Upload failed');
        }
      } catch (err) {
        text.innerHTML = '&#10060; Upload Failed';
        sub.textContent = err.message;
        box.style.borderColor = '#ef4444';
        toast(err.message, 'error');
      } finally {
        box.style.pointerEvents = 'auto';
      }
    }

    async function submitBook(event) {
      event.preventDefault();

      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="loading-spinner"></span> Saving...';

      // First upload the cover image
      const coverInput = document.getElementById('bCoverImage');
      let coverFileName = '';
      if (coverInput.files.length > 0) {
          const coverFormData = new FormData();
          coverFormData.append("file", coverInput.files[0]);
          try {
              const coverRes = await fetch('http://localhost:8080/api/books/upload-cover', {
                  method: 'POST',
                  headers: { 'Authorization': 'Bearer ' + token },
                  body: coverFormData
              });
              if (!coverRes.ok) throw new Error("Cover image upload failed");
              const coverData = await coverRes.json();
              coverFileName = coverData.fileName;
          } catch (e) {
              toast(e.message, 'error');
              submitBtn.disabled = false;
              submitBtn.textContent = 'Create Book';
              return;
          }
      }

      const title = document.getElementById('bTitle').value;
      const author = document.getElementById('bAuthor').value;
      const genre = document.getElementById('bGenre').value;
      const releaseDate = document.getElementById('bReleaseDate').value;
      const pageCount = parseInt(document.getElementById('bPageCount').value) || 0;
      const price = parseFloat(document.getElementById('bPrice').value);
      const format = document.getElementById('bFormat').value;
      const stock = parseInt(document.getElementById('bStock').value);
      const desc = document.getElementById('bDescription').value;
      const pdfFile = document.getElementById('pdfFileNameHidden').value;

      if (!pdfFile) {
        toast('Please upload a PDF file first.', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Book';
        return;
      }

      const book = {
        title: title,
        author: author,
        genre: genre,
        releaseDate: releaseDate,
        pageCount: pageCount,
        coverImage: coverFileName,
        price: price,
        bookFormat: format,
        stock: stock,
        description: desc,
        pdfFileName: pdfFile
      };

      try {
        const res = await fetch('http://localhost:8080/api/books', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify(book)
        });

        if (!res.ok) throw new Error('Failed to create book');
        
        toast('Book created successfully!', 'success');
        setTimeout(() => {
          window.location.href = 'admin-books.html';
        }, 1500);

      } catch (err) {
        toast(err.message, 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Book';
      }
    }
  </script>
<script src='theme.js'></script>
</body>
</html>
