<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audit Logs - Admin Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css?v=3.0"/>
</head>
<body>
  <header class="navbar glass-nav">
    <nav class="navbar">
      <div class="logo">
        <span class="logo-icon">&#10022;</span>
        <h1>Admin Portal</h1>
      </div>
      <ul class="nav-links">
        <li><a href="admin-dashboard.html" class="nav-link">Dashboard</a></li>
        <li><a href="admin-books.html" class="nav-link">Books</a></li>
        <li><a href="admin-users.html" class="nav-link">Users</a></li>
        <li><a href="admin-audit.html" class="nav-link active">Audit Logs</a></li>
      </ul>
      <div class="nav-actions">
        <button class="btn-primary" onclick="doLogout()">Log Out</button>
      </div>
    </nav>
  </header>

  <main class="main-content">
    <div class="page-header fade-in-up">
      <h1 class="gradient-text">Audit Trail</h1>
    </div>

    <div class="glass-panel fade-in-up" style="margin-top:2rem;">
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>Time</th>
              <th>Admin User</th>
              <th>Action</th>
              <th>Entity</th>
              <th>Details</th>
              <th>Options</th>
            </tr>
          </thead>
          <tbody id="auditBody">
            <tr><td colspan="6" style="text-align:center;padding:2rem;color:#888;">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <div id="deleteModal" class="modal-overlay hidden">
    <div class="modal glass-panel" style="max-width:400px;text-align:center;">
      <h2 style="color:#ff6b6b;">Confirm Delete</h2>
      <p style="margin-bottom:1.5rem;color:var(--text);">Delete this audit log? This cannot be undone.</p>
      <div style="display:flex;gap:1rem;justify-content:center;">
        <button class="btn-ghost" onclick="closeDeleteModal()">Cancel</button>
        <button class="btn-primary" style="background:#ff6b6b;color:#fff;" onclick="confirmDeleteLog()">Delete</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const API   = 'http://localhost:8080';
    const token = localStorage.getItem('sb_token');
    const user  = JSON.parse(localStorage.getItem('sb_user') || 'null');

    if (!token || !user || user.role !== 'ADMIN') {
      window.location.href = 'login.html';
    }

    function doLogout() {
      localStorage.removeItem('sb_token');
      localStorage.removeItem('sb_user');
      window.location.href = 'login.html';
    }

    async function loadAuditLogs() {
      const tbody = document.getElementById('auditBody');
      try {
        const res = await fetch(API + '/api/admin/logs', {
          headers: { 'Authorization': 'Bearer ' + token },
          cache: 'no-store'
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const logs = await res.json();

        if (!logs || !logs.length) {
          tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:2rem;color:#888;">No audit logs yet.</td></tr>';
          return;
        }

        tbody.innerHTML = logs.map(l => `
          <tr>
            <td style="color:#888;font-size:0.82rem;white-space:nowrap;">${new Date(l.timestamp).toLocaleString()}</td>
            <td><strong>${l.adminUsername || '—'}</strong></td>
            <td><span class="badge badge-${(l.actionType || '').toLowerCase()}">${l.actionType || '—'}</span></td>
            <td>${l.entityName || '—'}</td>
            <td style="color:#94a3b8;max-width:300px;overflow:hidden;text-overflow:ellipsis;">${l.details || '—'}</td>
            <td>
              <button class="btn-ghost btn-sm" style="color:#ff6b6b;border-color:rgba(255,107,107,0.3);" onclick="openDeleteModal(${l.id})">Delete</button>
            </td>
          </tr>
        `).join('');
      } catch (err) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:2rem;color:#ff6b6b;">Failed to load logs: ' + err.message + '</td></tr>';
      }
    }

    let logToDelete = null;

    function openDeleteModal(id) {
      logToDelete = id;
      document.getElementById('deleteModal').classList.remove('hidden');
    }

    function closeDeleteModal() {
      logToDelete = null;
      document.getElementById('deleteModal').classList.add('hidden');
    }

    async function confirmDeleteLog() {
      if (!logToDelete) return;
      const id = logToDelete;
      closeDeleteModal();
      try {
        const res = await fetch(API + '/api/admin/logs/' + id, {
          method: 'DELETE',
          headers: { 'Authorization': 'Bearer ' + token }
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        showToast('Audit log deleted', 'success');
        loadAuditLogs();
      } catch (err) {
        showToast('Failed to delete log', 'error');
      }
    }

    function showToast(msg, type) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast toast-' + (type || 'success') + ' show';
      setTimeout(() => t.className = 'toast', 3500);
    }

    loadAuditLogs();
  </script>
<script src='theme.js'></script>
</body>
</html>
