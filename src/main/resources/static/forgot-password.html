<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forgot Password - Starlight Bookstore</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=4.0" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
    .auth-container { width: 100%; max-width: 450px; padding: 3rem; text-align: center; }
  </style>
</head>
<body>
  <!-- Background Video -->
  <video autoplay muted loop playsinline class="bg-video">
    <source src="assets/videos/login-bg.mp4" type="video/mp4">
  </video>
  <div class="video-overlay"></div>

  <div class="glass-panel scale-in auth-container">
    <div style="margin-bottom: 2rem;">
      <div style="font-size: 4rem; margin-bottom: 1rem; filter: drop-shadow(0 4px 10px rgba(212,165,116,0.5));">📧</div>
      <h2 class="gradient-text" style="font-size:2.2rem; margin-bottom: 0;">Reset Your Password</h2>
    </div>
    
    <form id="forgotForm" onsubmit="submitForgot(event)">
      <div class="form-group">
        <label style="text-align:left; display:block;">Email Address</label>
        <div class="input-with-icon" style="position:relative;">
          <span style="position:absolute; left:1rem; top:50%; transform:translateY(-50%); font-size:1.1rem;">✉️</span>
          <input type="email" id="forgotEmail" required style="padding-left: 2.8rem;">
        </div>
      </div>
      
      <button type="submit" class="btn-primary w-100 mt-2" id="forgotSubmitBtn" style="font-size:1.1rem; padding: 1rem;">Send Reset Link</button>
    </form>
    
    <div style="margin-top: 1.5rem;">
      <a href="login.html" class="text-muted" style="text-decoration:none; font-size:0.9rem;">← Back to Sign In</a>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="app.js?v=6.0"></script>
  <script>
    async function submitForgot(e) {
      e.preventDefault();
      const email = document.getElementById('forgotEmail').value;
      const btn = document.getElementById('forgotSubmitBtn');
      const originalText = btn.textContent;
      btn.textContent = "Sending...";
      btn.disabled = true;

      try {
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        
        if (!res.ok) {
          throw new Error(data.message || 'An error occurred');
        }
        
        showToast(data.message, 'success');
        document.getElementById('forgotEmail').value = '';
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        btn.textContent = originalText;
        btn.disabled = false;
      }
    }
  </script>
<script src='theme.js'></script>
</body>
</html>
