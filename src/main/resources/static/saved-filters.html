<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Saved Filters - Starlight Bookstore</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=5.0" />
</head>
<body>
  <!-- Full Page Background Video -->
  <video autoplay muted loop playsinline class="bg-video">
    <source src="assets/videos/background.mp4" type="video/mp4">
  </video>
  <div class="video-overlay"></div>

  <!-- Navigation -->
  <header class="navbar glass-nav" id="navbar">
    <nav class="navbar" style="width:100%; padding:0; border:none; display:flex; justify-content:space-between; align-items:center;">
      <a href="index.html" class="logo" style="text-decoration:none;">✨ Starlight Bookstore</a>
      
      <ul class="nav-links" style="display:flex; gap:1.5rem; list-style:none;">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><a href="catalog.html" class="nav-link">Browse Books</a></li>
        <li><a href="wishlist.html" class="nav-link auth-only">Wishlist</a></li>
        <li><a href="orders.html" class="nav-link auth-only">Orders</a></li>
        <li><a href="support.html" class="nav-link auth-only">Support</a></li>
      </ul>
    </nav>
  </header>

  <main class="main-content" style="max-width: 1000px;">
    <section class="fade-in-up text-center" style="margin: 2rem 0;">
      <h1 class="gradient-text" style="font-size: 3rem; margin-bottom: 0.5rem; font-family: 'Outfit', sans-serif;">Your Saved Filters</h1>
      <p class="text-muted" style="font-size: 1.2rem;">Quickly apply your favorite search settings.</p>
    </section>

    <div class="glass-panel scale-in" style="padding: 2rem;">
      <table class="table w-100" style="color: white; width: 100%; border-collapse: collapse;">
        <thead>
          <tr style="border-bottom: 1px solid rgba(255,255,255,0.2);">
            <th style="text-align: left; padding: 1rem;">Filter Name</th>
            <th style="text-align: left; padding: 1rem;">Summary</th>
            <th style="text-align: right; padding: 1rem;">Actions</th>
          </tr>
        </thead>
        <tbody id="filtersTableBody">
          <tr><td colspan="3" class="text-center">Loading filters...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- Edit Name Modal -->
  <div id="editModalOverlay" class="modal-overlay hidden">
    <div class="glass-panel modal scale-in">
      <h2>Edit Filter Name</h2>
      <div class="form-group">
        <label>Filter Name</label>
        <input type="text" id="editFilterName" placeholder="Enter new name for the filter" />
      </div>
      <div style="display:flex; gap:1rem; margin-top:1.5rem; justify-content:flex-end;">
        <button class="btn-ghost" onclick="closeEditModal()">Cancel</button>
        <button class="btn-primary" onclick="saveEditModal()">Save</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="app.js?v=6.0"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      applyAuthState();
      if (!currentUser) {
        window.location.href = 'login.html';
        return;
      }
      loadSavedFilters();
    });

    let allFilters = [];

    async function loadSavedFilters() {
      const tbody = document.getElementById('filtersTableBody');
      try {
        const res = await fetch(API + '/api/saved-filters', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        if (!res.ok) throw new Error('Failed to load');
        allFilters = await res.json();
        
        if (allFilters.length === 0) {
          tbody.innerHTML = '<tr><td colspan="3" class="text-center text-muted">No saved filters found.</td></tr>';
          return;
        }

        tbody.innerHTML = allFilters.map(f => {
          let summary = [];
          if (f.searchQuery) summary.push(`Search: "${f.searchQuery}"`);
          if (f.categories) summary.push(`Categories: ${f.categories}`);
          if (f.minPrice || f.maxPrice) summary.push(`Price: ${f.minPrice || '0'}-${f.maxPrice || 'Any'}`);
          if (f.language) summary.push(`Language: ${f.language}`);
          if (f.minRating) summary.push(`Rating: ${f.minRating}+`);
          if (f.availability) summary.push(`Avail: ${f.availability}`);
          
          const summaryStr = summary.length > 0 ? summary.join(' | ') : 'No criteria';
          
          return `
            <tr style="border-bottom: 1px solid rgba(255,255,255,0.1);">
              <td style="padding: 1rem;"><strong>${f.name}</strong></td>
              <td style="padding: 1rem; color: #aaa; font-size: 0.9rem;">${summaryStr}</td>
              <td style="padding: 1rem; text-align: right; display: flex; gap: 0.5rem; justify-content: flex-end;">
                <button class="btn-primary btn-sm" onclick="applySavedFilter(${f.id})">Apply</button>
                <button class="btn-secondary btn-sm" onclick="editSavedFilter(${f.id})">Edit Name</button>
                <button class="btn-ghost btn-sm" style="color: #ff6b6b;" onclick="deleteSavedFilter(${f.id})">Delete</button>
              </td>
            </tr>
          `;
        }).join('');
      } catch (err) {
        tbody.innerHTML = '<tr><td colspan="3" class="text-center text-red">Failed to load filters.</td></tr>';
      }
    }

    function applySavedFilter(id) {
      const f = allFilters.find(x => x.id === id);
      if (!f) return;
      
      const params = new URLSearchParams();
      if (f.searchQuery) params.append('searchQuery', f.searchQuery);
      if (f.categories) params.append('categories', f.categories);
      if (f.language) params.append('language', f.language);
      if (f.minPrice) params.append('minPrice', f.minPrice);
      if (f.maxPrice) params.append('maxPrice', f.maxPrice);
      if (f.minRating) params.append('minRating', f.minRating);
      if (f.availability) params.append('availability', f.availability);
      
      window.location.href = 'catalog.html?' + params.toString();
    }

    let editingFilterId = null;

    function editSavedFilter(id) {
      const f = allFilters.find(x => x.id === id);
      if (!f) return;
      
      editingFilterId = id;
      document.getElementById('editFilterName').value = f.name;
      document.getElementById('editModalOverlay').classList.remove('hidden');
    }

    function closeEditModal() {
      document.getElementById('editModalOverlay').classList.add('hidden');
      editingFilterId = null;
    }

    async function saveEditModal() {
      if (!editingFilterId) return;
      const f = allFilters.find(x => x.id === editingFilterId);
      if (!f) return;
      
      const newName = document.getElementById('editFilterName').value.trim();
      if (!newName || newName === f.name) {
        closeEditModal();
        return;
      }
      
      f.name = newName;
      
      try {
        const res = await fetch(API + '/api/saved-filters/' + editingFilterId, {
          method: 'PUT',
          headers: { 
              'Authorization': 'Bearer ' + token,
              'Content-Type': 'application/json'
          },
          body: JSON.stringify(f)
        });
        if (res.ok) {
            loadSavedFilters();
            closeEditModal();
        } else {
            alert('Failed to update filter name.');
        }
      } catch (err) {
          alert('Error: ' + err.message);
      }
    }

    async function deleteSavedFilter(id) {
      if (!confirm("Are you sure you want to delete this filter?")) return;
      try {
        const res = await fetch(API + '/api/saved-filters/' + id, {
          method: 'DELETE',
          headers: { 'Authorization': 'Bearer ' + token }
        });
        if (res.ok) {
          loadSavedFilters();
        } else {
          alert('Failed to delete filter');
        }
      } catch (err) {
        alert('Error: ' + err.message);
      }
    }
  </script>
<script src='theme.js'></script>
</body>
</html>
