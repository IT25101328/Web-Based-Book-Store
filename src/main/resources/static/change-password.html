<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password - Starlight Bookstore</title>
  <meta name="description" content="Securely change your Starlight Bookstore account password.">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css?v=3.0"/>
  <style>
    .change-pw-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .change-pw-card {
      width: 100%;
      max-width: 480px;
      background: var(--glass);
      border: 1px solid var(--glass-b);
      border-radius: 20px;
      padding: 2.5rem;
      backdrop-filter: blur(16px);
      box-shadow: var(--shadow);
      animation: fadeInUp 0.6s ease;
    }
    .change-pw-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
      text-align: center;
    }
    .change-pw-card h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.8rem;
      font-weight: 900;
      text-align: center;
      margin-bottom: 0.5rem;
    }
    .change-pw-card p.subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }
    .form-group { margin-bottom: 1.2rem; }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .form-group input {
      width: 100%;
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--glass-b);
      border-radius: 10px;
      padding: 0.85rem 1rem;
      color: var(--text);
      font-size: 1rem;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
      box-sizing: border-box;
    }
    .form-group input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(212,175,55,0.12);
    }
    .btn-row {
      display: flex;
      gap: 1rem;
      margin-top: 1.5rem;
    }
    .msg-box {
      padding: 0.8rem 1rem;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      display: none;
      margin-bottom: 1rem;
    }
    .msg-box.success { background: rgba(74,222,128,0.1); border: 1px solid var(--green); color: var(--green); display: block; }
    .msg-box.error   { background: rgba(239,68,68,0.1);  border: 1px solid #ef4444;     color: #f87171; display: block; }
    .back-link {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .back-link a { color: var(--primary); text-decoration: none; font-weight: 600; }
    .back-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="change-pw-wrap">
    <div class="change-pw-card fade-in-up">
      <div class="change-pw-icon">🔐</div>
      <h1 class="gradient-text">Change Password</h1>
      <p class="subtitle">Enter your current password and choose a new one</p>

      <div id="msgBox" class="msg-box"></div>

      <form id="changePwForm" onsubmit="submitChange(event)">
        <div class="form-group">
          <label for="currentPw">Current Password</label>
          <input type="password" id="currentPw" placeholder="Enter current password" required autocomplete="current-password"/>
        </div>
        <div class="form-group">
          <label for="newPw">New Password</label>
          <input type="password" id="newPw" placeholder="At least 6 characters" required autocomplete="new-password" minlength="6"/>
        </div>
        <div class="form-group">
          <label for="confirmPw">Confirm New Password</label>
          <input type="password" id="confirmPw" placeholder="Repeat new password" required autocomplete="new-password" minlength="6"/>
        </div>
        <div class="btn-row">
          <button type="button" class="btn-ghost" style="flex:1;" onclick="history.back()">← Back</button>
          <button type="submit" id="submitBtn" class="btn-primary" style="flex:2;">Change Password</button>
        </div>
      </form>

      <div class="back-link">
        <a href="index.html">← Return to Home</a>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const API = 'http://localhost:8080';
    const token = localStorage.getItem('sb_token');
    const user = JSON.parse(localStorage.getItem('sb_user') || 'null');

    if (!token || !user) {
      window.location.href = 'login.html';
    }

    function showMsg(msg, type) {
      const box = document.getElementById('msgBox');
      box.textContent = msg;
      box.className = 'msg-box ' + type;
    }

    function showToast(msg, type) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast ' + (type === 'error' ? 'error' : 'success') + ' show';
      setTimeout(() => t.className = 'toast', 3500);
    }

    async function submitChange(e) {
      e.preventDefault();
      const currentPw = document.getElementById('currentPw').value;
      const newPw = document.getElementById('newPw').value;
      const confirmPw = document.getElementById('confirmPw').value;

      if (newPw !== confirmPw) {
        showMsg('New passwords do not match.', 'error');
        return;
      }
      if (newPw.length < 6) {
        showMsg('New password must be at least 6 characters.', 'error');
        return;
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'Updating...';

      try {
        const res = await fetch(API + '/api/user/change-password', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify({ currentPassword: currentPw, newPassword: newPw })
        });
        const data = await res.json();
        if (res.ok) {
          showMsg('✅ ' + data.message + ' Redirecting to login...', 'success');
          document.getElementById('changePwForm').reset();
          setTimeout(() => {
            localStorage.removeItem('sb_token');
            localStorage.removeItem('sb_user');
            window.location.href = 'login.html';
          }, 2000);
        } else {
          showMsg('❌ ' + (data.message || 'Failed to change password.'), 'error');
        }
      } catch (err) {
        showMsg('❌ Connection error. Please try again.', 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Change Password';
      }
    }
  </script>
<script src='theme.js'></script>
</body>
</html>
