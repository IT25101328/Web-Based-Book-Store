<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Users - Admin Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="styles.css?v=3.0"/>
</head>
<body>
  <header class="navbar glass-nav">
    <nav class="navbar">
      <div class="logo">
        <span class="logo-icon">&#10022;</span>
        <h1>Admin Portal</h1>
      </div>
      <ul class="nav-links">
        <li><a href="admin-dashboard.html" class="nav-link">Dashboard</a></li>
        <li><a href="admin-books.html" class="nav-link">Books</a></li>
        <li><a href="admin-users.html" class="nav-link active">Users</a></li>
        <li><a href="admin-audit.html" class="nav-link">Audit Logs</a></li>
      </ul>
      <div class="nav-actions">
        <button class="btn-primary" onclick="doLogout()">Log Out</button>
      </div>
    </nav>
  </header>

  <main class="main-content">
    <div class="page-header fade-in-up">
      <h1 class="gradient-text">Manage Users</h1>
    </div>

    <div class="admin-grid fade-in-up">
      <!-- Add User Form -->
      <div class="glass-panel">
        <h3 style="margin-bottom:1.2rem;color:var(--primary);">+ Add New User</h3>
        <form id="addUserForm" onsubmit="adminAddUser(event)">
          <div class="form-row">
            <div class="form-group"><label>Username</label><input type="text" id="uName" required/></div>
            <div class="form-group"><label>Email</label><input type="email" id="uEmail" required/></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>Password</label><input type="password" id="uPass" required/></div>
            <div class="form-group">
              <label>Role</label>
              <select id="uRole" style="width:100%;padding:0.5rem;border-radius:6px;background:#0d1228;color:var(--text);border:1px solid var(--glass-b);">
                <option value="CUSTOMER" selected>👤 Customer</option>
                <option value="OPERATIONS">🚚 Store Operations Manager</option>
                <option value="SUPPORT">🎫 Customer Service Supervisor</option>
                <option value="INVENTORY">📦 Inventory &amp; Purchasing Officer</option>
                <option value="FINANCE">💰 Finance &amp; Accounts Manager</option>
              </select>
            </div>
          </div>
          <button type="submit" class="btn-primary w-100">Create User</button>
        </form>
      </div>

      <!-- Users Table -->
      <div class="glass-panel">
        <h3 style="margin-bottom:1.2rem;color:var(--primary);">All Users</h3>
        <div class="table-wrap">
          <table class="data-table">
            <thead><tr><th>ID</th><th>Username</th><th>Email</th><th>Role</th><th>Action</th></tr></thead>
            <tbody id="usersBody"><tr><td colspan="5">Loading...</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <div id="deleteModal" class="modal-overlay hidden">
    <div class="modal glass-panel" style="max-width:400px;text-align:center;">
      <h2 style="color:#ff6b6b;">Confirm Delete</h2>
      <p style="margin-bottom:1.5rem;color:var(--text);">Delete this user? This cannot be undone.</p>
      <div style="display:flex;gap:1rem;justify-content:center;">
        <button class="btn-ghost" onclick="closeDeleteModal()">Cancel</button>
        <button class="btn-primary" style="background:#ff6b6b;color:#fff;" onclick="confirmDeleteUser()">Delete</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>
  <script>
    const API   = 'http://localhost:8080';
    const token = localStorage.getItem('sb_token');
    const user  = JSON.parse(localStorage.getItem('sb_user') || 'null');

    if (!token || !user || user.role !== 'ADMIN') {
      window.location.href = 'login.html';
    }

    function showToast(msg, type) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast toast-' + (type || 'success') + ' show';
      setTimeout(() => t.className = 'toast', 3500);
    }

    function doLogout() {
      localStorage.removeItem('sb_token');
      localStorage.removeItem('sb_user');
      window.location.href = 'login.html';
    }

    async function apiFetch(url, opts = {}) {
      const res = await fetch(API + url, {
        ...opts,
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token, ...(opts.headers || {}) },
        cache: 'no-store'
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      if (res.status === 204) return null;
      return res.json();
    }

    async function loadUsers() {
      try {
        const users = await apiFetch('/api/admin/users');
        if (!users || !users.length) {
          document.getElementById('usersBody').innerHTML = '<tr><td colspan="5" style="text-align:center;color:#888;">No users found</td></tr>';
          return;
        }
        document.getElementById('usersBody').innerHTML = users.map(u => `
          <tr>
            <td>${u.id}</td>
            <td><strong>${u.username}</strong></td>
            <td style="color:#888;">${u.email || '—'}</td>
            <td><span class="badge badge-${u.role.toLowerCase()}">${u.role}</span></td>
            <td>
              ${u.username !== 'admin'
                ? `<button class="btn-ghost btn-sm" style="color:#ff6b6b;border-color:rgba(255,107,107,0.3);" onclick="adminDeleteUser(${u.id})">Delete</button>`
                : '<span style="color:#888;font-size:0.8rem;">Protected</span>'}
            </td>
          </tr>
        `).join('');
      } catch (err) {
        document.getElementById('usersBody').innerHTML = '<tr><td colspan="5" style="text-align:center;color:#ff6b6b;">Failed to load users</td></tr>';
      }
    }

    async function adminAddUser(e) {
      e.preventDefault();
      const newUser = {
        username: document.getElementById('uName').value,
        email:    document.getElementById('uEmail').value,
        password: document.getElementById('uPass').value,
        role:     document.getElementById('uRole').value
      };
      try {
        await apiFetch('/api/admin/users', { method: 'POST', body: JSON.stringify(newUser) });
        document.getElementById('addUserForm').reset();
        showToast('User created successfully!', 'success');
        loadUsers();
      } catch (err) {
        showToast('Failed: ' + err.message, 'error');
      }
    }

    let userToDelete = null;

    function adminDeleteUser(id) {
      userToDelete = id;
      document.getElementById('deleteModal').classList.remove('hidden');
    }

    function closeDeleteModal() {
      userToDelete = null;
      document.getElementById('deleteModal').classList.add('hidden');
    }

    async function confirmDeleteUser() {
      if (!userToDelete) return;
      const id = userToDelete;
      closeDeleteModal();
      try {
        await apiFetch('/api/admin/users/' + id, { method: 'DELETE' });
        showToast('User deleted', 'success');
        loadUsers();
      } catch (err) {
        showToast('Failed: ' + err.message, 'error');
      }
    }

    loadUsers();
  </script>
<script src='theme.js'></script>
</body>
</html>
