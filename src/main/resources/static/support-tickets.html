<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Support - Tickets</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=3.0" />
</head>
<body>
  <header class="navbar glass-nav">
    <nav class="navbar">
      <div class="logo"><span class="logo-icon">🎧</span><h1>Support Portal</h1></div>
      <ul class="nav-links">
        <li><a href="support-dashboard.html" class="nav-link">Dashboard</a></li>
        <li><a href="support-tickets.html" class="nav-link active">Tickets</a></li>
        <li><a href="support-history.html" class="nav-link">History</a></li>
      </ul>
      <div class="nav-actions"><button class="btn-primary" onclick="logoutMPA()">Log Out</button></div>
    </nav>
  </header>
  <main class="main-content">
    <div class="page-header fade-in-up"><h1 class="gradient-text">Manage Tickets</h1></div>
    <div class="glass-panel fade-in-up">
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>ID</th><th>Customer</th><th>Subject</th><th>Status</th><th>Update Status</th></tr></thead>
          <tbody id="supTicketsBody"><tr><td colspan="5">Loading...</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>
  <div id="toast" class="toast"></div>
  <script src="app.js?v=6.0"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      enforceRole('SUPPORT');
      try {
        const tickets = await apiFetch('/api/support');
        document.getElementById('supTicketsBody').innerHTML = tickets.map(t => `
          <tr>
            <td>#${t.id}</td><td>${t.customerName}</td><td>${t.subject}</td>
            <td><span class="badge badge-${t.status.toLowerCase()}">${t.status}</span></td>
            <td>
              <select onchange="updateTicketStatus(${t.id}, this.value)" style="padding:0.3rem;border-radius:6px;">
                ${['OPEN','IN_PROGRESS','RESOLVED'].map(s => `<option value="${s}" ${t.status===s?'selected':''}>${s}</option>`).join('')}
              </select>
            </td>
          </tr>`).join('');
      } catch {}
    });
    async function updateTicketStatus(id, status) {
      try { await apiFetch(`/api/support/${id}/status`, { method:'PUT', body:JSON.stringify({ status }) }); showToast('Updated ✓', 'success'); } catch {}
    }
  </script>
<script src='theme.js'></script>
</body>
</html>
