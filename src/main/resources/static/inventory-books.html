<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Inventory - Books</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=3.0" />
</head>
<body>
  <header class="navbar glass-nav">
    <nav class="navbar">
      <div class="logo"><span class="logo-icon">📋</span><h1>Inventory Portal</h1></div>
      <ul class="nav-links">
        <li><a href="inventory-dashboard.html" class="nav-link">Dashboard</a></li>
        <li><a href="inventory-books.html" class="nav-link active">Manage Books</a></li>
        <li><a href="inventory-purchasing.html" class="nav-link">Purchasing</a></li>
      </ul>
      <div class="nav-actions"><button class="btn-primary" onclick="logoutMPA()">Log Out</button></div>
    </nav>
  </header>
  <main class="main-content">
    <div class="page-header fade-in-up"><h1 class="gradient-text">Manage Books</h1></div>
    <div class="glass-panel fade-in-up">
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>Title</th><th>Price</th><th>Stock</th><th>Action</th></tr></thead>
          <tbody id="invBooksBody"><tr><td colspan="4">Loading...</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>
  <script src="app.js?v=6.0"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      enforceRole('INVENTORY');
      try {
        const books = await apiFetch('/api/books');
        document.getElementById('invBooksBody').innerHTML = books.map(b => `
          <tr>
            <td>${b.coverImage ? `<img src="/uploads/covers/${b.coverImage}" style="width:100%; height:100%; object-fit:cover; border-radius:inherit;"/>` : '📖'} ${b.title}</td>
            <td>Rs ${Number(b.price).toFixed(2)}</td>
            <td class="${b.stock <= 5 ? 'stock-low' : ''}">${b.stock}</td>
            <td><button class="btn-primary btn-sm">Edit Stock</button></td>
          </tr>`).join('');
      } catch {}
    });
  </script>
<script src='theme.js'></script>
</body>
</html>
